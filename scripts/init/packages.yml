---
- name: Install required base packages
  hosts: localhost
  connection: local
  tasks:
    - name: Ensure base packages are present
      become: true
      ansible.builtin.package:
        name:
          - git
          - curl
          - wget
          - tar
          - unzip
          - build-essential
          - xclip
          - ripgrep
        state: present
      when: ansible_os_family != "Darwin"

    # Homebrew refuses to run as root, so no become here. tar/unzip ship with
    # macOS, pbcopy replaces xclip, and compilers come from the Xcode CLT.
    - name: Ensure base packages are present (macOS)
      community.general.homebrew:
        name:
          - git
          - curl
          - wget
          - ripgrep
        state: present
      when: ansible_os_family == "Darwin"
